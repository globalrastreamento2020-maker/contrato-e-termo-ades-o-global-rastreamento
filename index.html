<style>
  /* Tema laranja & preto - profissional */
  :root{
    --preto:#000000;

    --laranja:#ff7b00;
    --laranja-esc:#cc5a00;
    --texto:#eaf0f6;

    --bordas:#222;

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--fundo);
    color:var(--texto);
    font-family: "Times New Roman", Times, serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:28px auto;padding:18px}
  .card{
    background:linear-gradient(180deg, rgba(10,10,10,1), rgba(8,8,8,1));
    border-radius:12px;padding:22px;border:1px solid var(--bordas);
    box-shadow:0 8px 40px rgba(0,0,0,0.6);

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .brand{display:flex;flex-direction:column}
  .brand h1{margin:0;color:var(--laranja);font-size:20px;letter-spacing:0.4px}
  .brand small{color:var(--muted);font-size:12px}
  .meta{color:var(--muted);font-size:13px;text-align:right}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input[type="text"], input[type="date"], input[type="number"], textarea, select{
    width:100%;padding:10px;border-radius:8px;border:1px solid #222;background:#0b0b0b;color:var(--texto);
    font-size:14px;margin-bottom:10px;
  }
  textarea{min-height:80px;resize:vertical}
  .checks{display:flex;flex-direction:column;gap:6px;background:#0d0d0d;border:1px solid #222;padding:10px;border-radius:8px}
  .checks label{display:flex;gap:8px;align-items:center;color:#fff;font-size:14px}
  input[type="checkbox"]{accent-color:var(--laranja);transform:scale(1.1)}

  .actions{display:flex;gap:10px;justify-content:space-between;margin-top:12px;align-items:center}
  button{background:var(--laranja);color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}

  #previewPdf{

  .pdf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .pdf-title{color:#cc5a00;font-size:16px;font-weight:700}
  .pdf-meta{font-size:12px;color:#333}
  .clause{background:#fff8f0;border:1px solid #ffd0a8;padding:10px;margin:10px 0;border-radius:4px}

<script>
/* Utilidades */
function formatDataPtBr(isoDate){
  if(!isoDate) { isoDate = new Date().toISOString().slice(0,10);}
  const [y,m,d] = isoDate.split('-');
  const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${d} de ${meses[parseInt(m,10)-1]} de ${y}`;
}
function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
function checkedMark(b){ return b ? '[X]' : '[ ]'; }

function readForm(){
  return {

    cpf: document.getElementById('cpf').value || '',

    telefone: document.getElementById('telefone').value || '',
    email: document.getElementById('email').value || '',
    mensalidade: document.getElementById('mensalidade').value || '0,00',
    qtd: document.getElementById('qtd').value || '0',
    data: document.getElementById('data').value || new Date().toISOString().slice(0,10),
    forma: document.getElementById('forma').value || '',
    ativacao: document.getElementById('ativacao').value || '0,00',
    vencimento: document.getElementById('vencimento').value || 'Todo dia 10 de cada mês',
    plSoftware: document.getElementById('plSoftware').checked,
    plChip: document.getElementById('plChip').checked,
    plRastreador: document.getElementById('plRastreador').checked
  };
}

    </div>

    <div class="clause"><h3>CLÁUSULA 7 – DAS LIMITAÇÕES TÉCNICAS</h3>
      <div>7.1. O LICENCIADO reconhece que o funcionamento do sistema depende de sinais de GPS, GSM/GPRS, internet e servidores, estando sujeito a falhas técnicas, áreas de sombra, interferências e indisponibilidades.<br>

      <div>8.1. A LICENCIANTE não se responsabiliza por: (a) falhas técnicas, interrupções ou indisponibilidades do sistema; (b) furtos, roubos, perdas ou danos sofridos pelo LICENCIADO; (c) custos com instalação, manutenção ou substituição de equipamentos; (d) prejuízos decorrentes do uso indevido do software ou hardware; (e) decisões operacionais ou de segurança tomadas pelo LICENCIADO.</div>
    </div>

    <div class="clause"><h3>CLÁUSULA 9 – DO SUPORTE</h3>
      <div>9.1. A LICENCIANTE prestará suporte técnico relacionado ao uso do software, em horário comercial, por meio do telefone (75) 98819-0527 e do e-mail globalrastreamento2020@gmail.com.</div>
    </div>

    <div class="clause"><h3>CLÁUSULA 10 – DO PRAZO E PAGAMENTO</h3>
      <div>10.1. O presente contrato terá vigência conforme estabelecido no Termo de Adesão, renovável automaticamente, salvo manifestação em contrário de qualquer das partes.<br>
      10.2. O LICENCIADO pagará à LICENCIANTE os valores constantes do Termo de Adesão, estando sujeito à suspensão de acesso em caso de inadimplência.</div>
    </div>

    <div class="clause"><h3>CLÁUSULA 11 – DA RESCISÃO</h3>
      <div>11.1. O presente contrato poderá ser rescindido por qualquer das partes, mediante aviso prévio de 30 (trinta) dias.<br>
      11.2. Em caso de inadimplência superior a 30 (trinta) dias, a LICENCIANTE poderá suspender o acesso ao software e rescindir o contrato de pleno direito.</div>
    </div>

    <div class="clause"><h3>CLÁUSULA 12 – DAS ALTERAÇÕES LEGISLATIVAS</h3>
      <div>12.1. Caso haja alteração na legislação que impacte a atividade de rastreamento e telemetria, as partes se comprometem a revisar as condições do presente contrato, sem que isso implique obrigação retroativa para a LICENCIANTE.</div>
    </div>

      <div>13.1. Para dirimir quaisquer controvérsias oriundas deste contrato, fica eleito o foro da Comarca de Paulo Afonso – BA, com renúncia a qualquer outro, por mais privilegiado que seja.</div>
    </div>

    <!-- TERMO DE ADESÃO -->
    <div style="page-break-before:always;"></div>
    <div class="pdf-header">
      <div class="pdf-title">TERMO DE ADESÃO</div>
      <div class="pdf-meta">(Anexo ao Contrato de Licença de Uso de Software e Fornecimento Opcional de Dispositivos)</div>
    </div>

    <table class="pdf-table">
      <tr><th>Nome / Razão Social</th><td>${escapeHtml(f.nome)}</td></tr>
      <tr><th>CPF / CNPJ</th><td>${escapeHtml(f.cpf)}</td></tr>
      <tr><th>Endereço</th><td>${escapeHtml(f.endereco)}</td></tr>
      <tr><th>Cidade / UF</th><td>${escapeHtml(f.cidade)}</td></tr>
      <tr><th>Telefone</th><td>${escapeHtml(f.telefone)}</td></tr>
      <tr><th>E-mail</th><td>${escapeHtml(f.email)}</td></tr>

    <div style="margin-top:12px">

/* DOM & Eventos */
const preview = document.getElementById('previewPdf');
document.getElementById('btnGenerate').addEventListener('click', ()=>{
  const f = readForm();
  preview.style.display = 'block';
  preview.innerHTML = buildPreviewHtml(f);
  preview.scrollIntoView({behavior:'smooth'});
});
document.getElementById('btnBack').addEventListener('click', ()=> window.history.back());

/* Geração do PDF com paginação */
document.getElementById('btnDownload').addEventListener('click', async ()=>{
  if(preview.innerHTML.trim() === '') {
    const f = readForm();
    preview.style.display = 'block';
    preview.innerHTML = buildPreviewHtml(f);
  }
  await new Promise(r => setTimeout(r,120));
  const scale = 2;
  const canvas = await html2canvas(preview, { scale, useCORS:true, backgroundColor:'#ffffff' });

  const imgData = canvas.toDataURL('image/jpeg', 1.0);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','pt','a4');

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();

  const imgProps = pdf.getImageProperties(imgData);
  const imgW = pageW;
  const imgH = (imgProps.height * imgW) / imgProps.width;

  let heightLeft = imgH;
  let position = 0;

  pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
  heightLeft -= pageH;

  while(heightLeft > 0){
    position = heightLeft - imgH;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;
  }

  // Numeração de páginas
  const total = pdf.internal.getNumberOfPages();
  for(let i=1;i<=total;i++){
    pdf.setPage(i);
    pdf.setFontSize(9);
    pdf.setTextColor(120);
    pdf.text(`Página ${i} de ${total}`, pageW-80, pageH-20);
  }

  pdf.save('Contrato_Termo_Global_Rastreamento.pdf');
});
</script>
